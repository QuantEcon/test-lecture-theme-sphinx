# drawn.yml -- this site's drawn selectors for the families' drawn checks (QuantEcon/project-theme-parity#15, D18).
#
# A copy of bin/drawn.yml in QuantEcon/project-theme-parity at the commit `source` names, taking only this theme's
# side of each entry (`sphinx:`), with `each` expanded. It is a copy because that repository is private, and this
# repository's CI cannot read it. The entries keep that file's order and its ids, which are bin/families.yml's: a row
# of counts.csv is keyed by the family id, and that repository's bin/measure sets it beside this build's own engine
# count (structure.csv), never beside the other site's.
#
# Each entry carries what a count needs:
#   id         the family id, expanded (`prf-theorem`, `heading-h2`)
#   selector   this theme's selector over the page's content: a Playwright selector (CSS, with `:has()`, `:text-is()`,
#              `:text-matches()` and `:has-text()` allowed), every element it matches counting; or {select, in, text},
#              the elements `select` matches whose own text, or the text of their first `in` descendant, whitespace
#              collapsed and trimmed, matches the regular expression `text`, compiled as a JavaScript RegExp with the
#              `u` flag; or null where this theme draws no surface a selector can count, which counts.csv records by
#              writing no rows for it, not as a count of 0
#   why        only where the selector is null: invisible, inline-maths, report, styling, anchor, no-surface or text
#   corrected  only where a selector had moved on this site's build: {from: the selector as copied, why: what moved}
#
# Every selector was checked against this site's build before it was copied here. One that has moved is corrected
# here, with its `corrected:` note, and carried in provenance.json, until bin/drawn.yml carries it too; this
# repository cannot change that file, so the PR that makes a correction proposes it there. None is open on this site.
source:
  repository: QuantEcon/project-theme-parity
  path: bin/drawn.yml
