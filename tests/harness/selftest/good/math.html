<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Maths — self-test</title>
<style>body{margin:0;font:16px sans-serif} .qe-page__content{max-width:800px;margin:0 auto} .qe-page__content p{font-size:18px}
body.dark-theme{background:#1b1e23;color:#ddd} pre{margin:0}

mjx-container[jax="CHTML"]{line-height:0} mjx-container[jax="CHTML"][display="true"]{display:block;text-align:center;margin:1em 0}
mjx-math{display:inline-block;text-align:left;line-height:0;padding:1px 0} mjx-c{display:inline-block} mjx-c::before{display:block;width:0}
.MJX-TEX{font-family:MJXZERO,MJXTEX} .TEX-I{font-family:MJXZERO,MJXTEX-I} .TEX-A{font-family:MJXZERO,MJXTEX-A} [size="s"]{font-size:70.7%}
mjx-c.mjx-c1D44E::before{padding:.441em .529em .011em 0;content:"\1D44E"} mjx-c.mjx-c1D44F::before{padding:.694em .429em .011em 0;content:"\1D44F"}
mjx-c.mjx-c1D450::before{padding:.442em .433em .011em 0;content:"\1D450"} mjx-c.mjx-c1D451::before{padding:.694em .52em .01em 0;content:"\1D451"}
mjx-c.mjx-c1D452::before{padding:.442em .466em .011em 0;content:"\1D452"} mjx-c.mjx-c1D465::before{padding:.442em .572em .011em 0;content:"\1D465"}
mjx-c.mjx-c3D::before{padding:.583em .778em .082em 0;content:"="} mjx-c.mjx-cAF::before{padding:.59em .5em 0 0;content:"\AF"}
mjx-c.mjx-c32::before{padding:.666em .5em 0 0;content:"2"} mjx-c.mjx-c211D::before{padding:.683em .722em 0 0;content:"\211D"}
mjx-assistive-mml{position:absolute!important;top:0;left:0;clip:rect(1px,1px,1px,1px);padding:1px 0 0 0!important;border:0!important;display:block!important;width:auto!important;overflow:hidden!important}
/* the metrics (D19): each measured box pinned in px, so the expected metrics hold whatever the platform's fonts */
mjx-container[display="true"]{height:40px}</style></head>
<body>
<script>/* the theme's scheme: localStorage.setContrast, '1' for dark (layout.html) */
try { if (localStorage.setContrast === "1") document.body.classList.add("dark-theme"); } catch (e) {}</script>
<ul class="qe-toolbar"><li class="btn__contrast" data-tippy-content="Toggle dark mode">contrast</li></ul>
<main class="qe-page__content"><section class="tex2jax_ignore mathjax_ignore" id="mathematics">
<!-- maths as MathJax 3.2.2 (tex-mml-chtml) leaves it once typeset: the delimiters Sphinx wrote are gone, and the
     error markers find nothing; a price in dollars and TeX in code are not maths left raw -->
<p>A paragraph of lecture text, long enough to measure, with <a href="intro.html">a link</a>, which costs $5 or $10.</p>
<p>Inline <span class="math notranslate nohighlight"><mjx-container class="MathJax CtxtMenu_Attached_0" jax="CHTML" tabindex="0" ctxtmenu_counter="1" style="font-size: 101.6%; position: relative;"><mjx-math class="MJX-TEX" aria-hidden="true"><mjx-texatom texclass="ORD"><mjx-mi class="mjx-ds mjx-b"><mjx-c class="mjx-c211D TEX-A"></mjx-c></mjx-mi></mjx-texatom></mjx-math><mjx-assistive-mml unselectable="on" display="inline"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mi mathvariant="double-struck">R</mi></mrow></math></mjx-assistive-mml></mjx-container></span>, written <code class="docutils literal notranslate"><span class="pre">\(\RR\)</span></code> or <code class="docutils literal notranslate"><span class="pre">$$\RR$$</span></code>.</p>
<!-- the metrics: two displays, as MathJax 3's CommonHTML draws them. A reader sees the glyphs, each the ::before content
     of an mjx-c in MathJax's TeX fonts (theme.mjs's glyphs), and not the assistive MathML, which MathJax clips to nothing
     and which has more characters. The first carries a label, `mean` (on the div.math, as Sphinx writes it); the
     mystmd corpus's fixture draws the two in the other order, and their keys, from the TeX, are the same there -->
<div class="math notranslate nohighlight" id="equation-mean"><span class="eqno">(1)<a class="headerlink" href="#equation-mean" title="Link to this equation">#</a></span><mjx-container class="MathJax CtxtMenu_Attached_0" jax="CHTML" display="true" tabindex="0" ctxtmenu_counter="2" style="font-size: 101.6%; position: relative;"><mjx-math display="true" class="MJX-TEX" aria-hidden="true" style="margin-left: 0px; margin-right: 0px;"><mjx-mtable><mjx-table><mjx-itable><mjx-mtr><mjx-mtd><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D44E TEX-I"></mjx-c></mjx-mi><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D44F TEX-I"></mjx-c></mjx-mi></mjx-mtd><mjx-mtd><mjx-mo class="mjx-n" space="4"><mjx-c class="mjx-c3D"></mjx-c></mjx-mo><mjx-texatom space="4" texclass="ORD"><mjx-mover><mjx-over><mjx-mo class="mjx-n"><mjx-c class="mjx-cAF"></mjx-c></mjx-mo></mjx-over><mjx-base><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D450 TEX-I"></mjx-c></mjx-mi></mjx-base></mjx-mover></mjx-texatom></mjx-mtd></mjx-mtr><mjx-mtr><mjx-mtd><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D450 TEX-I"></mjx-c></mjx-mi></mjx-mtd><mjx-mtd><mjx-mo class="mjx-n" space="4"><mjx-c class="mjx-c3D"></mjx-c></mjx-mo><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D451 TEX-I"></mjx-c></mjx-mi><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D452 TEX-I"></mjx-c></mjx-mi></mjx-mtd></mjx-mtr></mjx-itable></mjx-table></mjx-mtable></mjx-math><mjx-assistive-mml unselectable="on" display="block"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mtable displaystyle="true" columnalign="right left"><mtr><mtd><mi>a</mi><mi>b</mi></mtd><mtd><mo>=</mo><mrow data-mjx-texclass="ORD"><mover><mi>c</mi><mo stretchy="false">¯</mo></mover></mrow></mtd></mtr><mtr><mtd><mi>c</mi></mtd><mtd><mo>=</mo><mi>d</mi><mi>e</mi></mtd></mtr></mtable></math></mjx-assistive-mml></mjx-container></div>
<div class="math notranslate nohighlight"><mjx-container class="MathJax CtxtMenu_Attached_0" jax="CHTML" display="true" tabindex="0" ctxtmenu_counter="3" style="font-size: 101.6%; position: relative;"><mjx-math display="true" class="MJX-TEX" aria-hidden="true" style="margin-left: 0px; margin-right: 0px;"><mjx-msup><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D465 TEX-I"></mjx-c></mjx-mi><mjx-script style="vertical-align: 0.413em;"><mjx-mn class="mjx-n" size="s"><mjx-c class="mjx-c32"></mjx-c></mjx-mn></mjx-script></mjx-msup></mjx-math><mjx-assistive-mml unselectable="on" display="block"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><msup><mi>x</mi><mn>2</mn></msup></math></mjx-assistive-mml></mjx-container></div>
<!-- the metrics: MathJax's math list, as MathJax keeps it once typeset: each expression's TeX on its MathItem beside the
     element it typeset, the inline one first; the key reads the display's own, and drops the wrappers, \tag, \label
     and spacing the two stacks write differently -->
<script>window.MathJax = { startup: { document: { math: [
  { math: "\\RR", display: false, typesetRoot: document.querySelector("p mjx-container") },
  { math: "\\begin{align} ab &= \\bar{c} \\\\ c &= d\\,e \\end{align}", display: true, typesetRoot: document.querySelectorAll('mjx-container[display="true"]')[0] },
  { math: "\\begin{equation} x^2 \\label{eq-y} \\end{equation}", display: true, typesetRoot: document.querySelectorAll('mjx-container[display="true"]')[1] },
] } } };</script>
<!-- TeX in prose the section tells MathJax to leave alone, outside any .math element: not maths MathJax was asked to
     typeset, so not read, by MathJax's own rule -->
<p>A literal \(y\) in the prose.</p>
<div class="highlight-latex notranslate"><div class="highlight"><pre><span></span>\begin{align} a &amp;= \bar{b} \end{align}</pre></div></div>
</section></main>
<script>/* a working toggle: switches the page and keeps the choice */
document.querySelector(".btn__contrast").addEventListener("click", function () {
  var dark = !document.body.classList.contains("dark-theme");
  document.body.classList.toggle("dark-theme", dark);
  localStorage.setContrast = dark ? 1 : 0;
});</script>
</body></html>
