<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Code cells — self-test</title>
<!-- the page's address, as a build made for the base writes it (the self-test replaces {{base}}) -->
<link rel="canonical" href="https://quantecon.github.io{{base}}code_cells.html">
<meta property="og:url" content="https://quantecon.github.io{{base}}code_cells.html">
<meta property="og:title" content="Code cells">
<meta property="og:image" content="https://assets.quantecon.org/img/qe-og-logo.png">
<meta property="og:site_name" content="Self-test Lectures">
<meta name="twitter:card" content="summary">
<style>body{margin:0;font:16px sans-serif} .qe-page__content{max-width:800px;margin:0 auto} .qe-page__content p{font-size:18px}
body.dark-theme{background:#1b1e23;color:#ddd} .stderr-content{display:none} .stderr-content.expanded{display:block}
.highlight{overflow:hidden;position:relative} pre{margin:0}
/* the metrics (D19): each measured box pinned in px, so the expected metrics hold whatever the platform's fonts */
.cell{height:120px;overflow-x:auto} .cell .wide{width:1000px;height:1px}</style></head>
<body>
<script>/* the theme's scheme: localStorage.setContrast, '1' for dark (layout.html) */
try { if (localStorage.setContrast === "1") document.body.classList.add("dark-theme"); } catch (e) {}</script>
<ul class="qe-toolbar"><li class="btn__contrast" data-tippy-content="Toggle dark mode">contrast</li></ul>
<div class="qe-page__header"><h1 class="qe-page__header-heading"><a href="intro.html">Self-test Lectures</a></h1></div><main class="qe-page__content"><section class="tex2jax_ignore mathjax_ignore" id="code-cells"><p>A paragraph of lecture text, long enough to measure, with <a href="intro.html">a link</a>.</p>
<div class="cell docutils container"><div class="cell_input docutils container"><div class="highlight-ipython3 notranslate"><div class="highlight"><pre id="codecell0"><span></span>import numpy as np
x = np.linspace(0, 1, 5)</pre><button class="copybtn o-tooltip--left" data-tooltip="Copy" data-clipboard-target="#codecell0">copy</button></div></div></div>
<!-- the metrics: content wider than the cell, which scrolls it, so the cell overflows and the page does not -->
<div class="wide"></div></div>
<!-- the drawn counts: a second cell, tagged hide-output, whose output the theme draws inside the closed toggle -->
<div class="cell tag_hide-output docutils container"><div class="cell_input docutils container"><div class="highlight-ipython3 notranslate"><div class="highlight"><pre id="codecell1"><span></span>print(x.sum())</pre></div></div></div>
<details class="admonition hide below-input"><summary aria-label="Toggle hidden content"><p class="collapsed admonition-title">Show output</p></summary>
<div class="cell_output docutils container"><div class="output stream highlight-myst-ansi notranslate"><div class="highlight"><pre id="codecell2"><span></span>2.5</pre></div></div></div></details></div>
<!-- the metrics: a third cell, whose output shows no text (its text measures are empty), and is the second output
     drawn and the first shown: its n is 2 -->
<div class="cell docutils container"><div class="cell_input docutils container"><div class="highlight-ipython3 notranslate"><div class="highlight"><pre id="codecell3"><span></span>plt.plot(x)</pre></div></div></div>
<div class="cell_output docutils container"><div class="output text_plain" style="width:120px;height:60px;background:#888888"></div></div></div></section></main><div class="stderr-collapsible-wrapper"><button class="stderr-toggle-button" aria-expanded="false">Code warnings</button>
<div class="stderr-content">UserWarning: this goes to stderr</div></div>
<script>document.querySelector(".stderr-toggle-button").addEventListener("click", function () {
  document.querySelector(".stderr-content").classList.toggle("expanded"); });</script>
<script>/* a working copy button (sphinx-copybutton): the cell's source to the clipboard */
document.querySelector(".copybtn").addEventListener("click", function () {
  navigator.clipboard.writeText(document.querySelector(this.dataset.clipboardTarget).innerText); });</script>
<script>/* a working toggle: switches the page and keeps the choice */
document.querySelector(".btn__contrast").addEventListener("click", function () {
  var dark = !document.body.classList.contains("dark-theme");
  document.body.classList.toggle("dark-theme", dark);
  localStorage.setContrast = dark ? 1 : 0;
});</script>
</body></html>
