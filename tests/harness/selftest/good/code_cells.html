<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Code cells — self-test</title>
<!-- the page's address, as a build made for the base writes it (the self-test replaces {{base}}) -->
<link rel="canonical" href="https://quantecon.github.io{{base}}code_cells.html">
<meta property="og:url" content="https://quantecon.github.io{{base}}code_cells.html">
<meta property="og:title" content="Code cells">
<meta property="og:image" content="https://assets.quantecon.org/img/qe-og-logo.png">
<meta property="og:site_name" content="Self-test Lectures">
<meta name="twitter:card" content="summary">
<style>body{margin:0;font:16px sans-serif} .qe-page__content{max-width:800px;margin:0 auto} .qe-page__content p{font-size:18px}
body.dark-theme{background:#1b1e23;color:#ddd} .stderr-content{display:none} .stderr-content.expanded{display:block}
.highlight{overflow:hidden;position:relative} pre{margin:0}</style></head>
<body>
<script>/* the theme's scheme: localStorage.setContrast, '1' for dark (layout.html) */
try { if (localStorage.setContrast === "1") document.body.classList.add("dark-theme"); } catch (e) {}</script>
<ul class="qe-toolbar"><li class="btn__contrast" data-tippy-content="Toggle dark mode">contrast</li></ul>
<div class="qe-page__header"><h1 class="qe-page__header-heading"><a href="intro.html">Self-test Lectures</a></h1></div><div class="qe-page__content"><section class="tex2jax_ignore mathjax_ignore" id="code-cells"><p>A paragraph of lecture text, long enough to measure, with <a href="intro.html">a link</a>.</p>
<div class="cell docutils container"><div class="cell_input docutils container"><div class="highlight-ipython3 notranslate"><div class="highlight"><pre id="codecell0"><span></span>import numpy as np
x = np.linspace(0, 1, 5)</pre><button class="copybtn o-tooltip--left" data-tooltip="Copy" data-clipboard-target="#codecell0">copy</button></div></div></div></div></section></div><div class="stderr-collapsible-wrapper"><button class="stderr-toggle-button" aria-expanded="false">Code warnings</button>
<div class="stderr-content">UserWarning: this goes to stderr</div></div>
<script>document.querySelector(".stderr-toggle-button").addEventListener("click", function () {
  document.querySelector(".stderr-content").classList.toggle("expanded"); });</script>
<script>/* a working copy button (sphinx-copybutton): the cell's source to the clipboard */
document.querySelector(".copybtn").addEventListener("click", function () {
  navigator.clipboard.writeText(document.querySelector(this.dataset.clipboardTarget).innerText); });</script>
<script>/* a working toggle: switches the page and keeps the choice */
document.querySelector(".btn__contrast").addEventListener("click", function () {
  var dark = !document.body.classList.contains("dark-theme");
  document.body.classList.toggle("dark-theme", dark);
  localStorage.setContrast = dark ? 1 : 0;
});</script>
</body></html>
