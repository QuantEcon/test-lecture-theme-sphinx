<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Code cells — self-test</title>
<!-- page-meta wrong at any base, two ways. In light only the canonical link is wrong: it names another page. In dark
     the script at the end puts it right, names another page in og:url instead, and drops twitter:card -->
<link rel="canonical" href="https://quantecon.github.io{{base}}typography.html">
<meta property="og:url" content="https://quantecon.github.io{{base}}code_cells.html">
<meta property="og:title" content="Code cells">
<meta property="og:image" content="https://assets.quantecon.org/img/qe-og-logo.png">
<meta property="og:site_name" content="Self-test Lectures">
<meta name="twitter:card" content="summary">
<style>body{margin:0;font:16px sans-serif} .qe-page__content{max-width:800px;margin:0 auto} .qe-page__content p{font-size:18px}
body.dark-theme{background:#1b1e23;color:#ddd} .stderr-content{display:none} .stderr-content.expanded{display:block}
.highlight{overflow:hidden;position:relative} pre{margin:0}
/* the metrics (D19): each measured box pinned in px, so the expected metrics hold whatever the platform's fonts */
.cell{height:120px} main h1{margin:0;height:40px;font-size:32px;line-height:40px}</style></head>
<body>
<script>/* the theme's scheme: localStorage.setContrast, '1' for dark (layout.html) */
try { if (localStorage.setContrast === "1") document.body.classList.add("dark-theme"); } catch (e) {}</script>
<ul class="qe-toolbar"><li class="btn__contrast" data-tippy-content="Toggle dark mode">contrast</li></ul>
<div class="qe-page__header"><h1>Self-test Lectures, the title not linked</h1></div><main class="qe-page__content"><section class="tex2jax_ignore mathjax_ignore" id="code-cells"><h1>Self-test Lectures, the title not linked</h1>
<!-- the metrics: the page's one paragraph is boxed, in an exercise's content section, so it has no body text, though it
     is a section's paragraph: the body measures are empty -->
<div class="exercise admonition" id="selftest-ex-2"><p class="admonition-title">Exercise 2</p><section id="exercise-content"><p>A paragraph of lecture text, long enough to measure, with <a href="intro.html">a link</a>.</p></section></div>
<div class="cell docutils container"><div class="cell_input docutils container"><div class="highlight-ipython3 notranslate"><div class="highlight"><pre id="codecell0"><span></span>import numpy as np
x = np.linspace(0, 1, 5)</pre><button class="copybtn o-tooltip--left" data-tooltip="Copy" data-clipboard-target="#codecell0">copy</button></div></div></div></div></section></main><div class="stderr-collapsible-wrapper"><button class="stderr-toggle-button" aria-expanded="false">Code warnings</button>
<div class="stderr-content expanded">UserWarning: this goes to stderr</div></div>
<script>document.querySelector(".stderr-toggle-button").addEventListener("click", function () {
  document.querySelector(".stderr-content").classList.toggle("expanded"); });</script>
<script>/* a dead copy button: the click copies nothing. And in dark, the page refuses clipboard writes, as a browser
   that denies the page the clipboard would, so the harness cannot put its marker there: the check is skip */
if (document.body.classList.contains("dark-theme")) {
  navigator.clipboard.writeText = function () { return Promise.reject(new DOMException("Write permission denied.", "NotAllowedError")); };
}</script>
<script>/* a broken toggle: the click does nothing */
document.querySelector(".btn__contrast").addEventListener("click", function () {});</script>
<script>console.error("harness self-test: a console error on load");</script>
<script>/* in dark: the canonical link right, og:url naming another page, and no twitter:card */
if (document.body.classList.contains("dark-theme")) {
  var canonical = document.querySelector('link[rel="canonical"]'), og = document.querySelector('meta[property="og:url"]');
  canonical.setAttribute("href", og.getAttribute("content"));
  og.setAttribute("content", og.getAttribute("content").replace("code_cells.html", "typography.html"));
  document.querySelector('meta[name="twitter:card"]').remove();
}</script>
</body></html>
