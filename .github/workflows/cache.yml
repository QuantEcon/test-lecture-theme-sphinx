name: Build Cache
on:
  schedule:
    - cron: '0 3 * * 0'  # weekly, Sunday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: cache-build
  cancel-in-progress: false

jobs:
  build-cache:
    runs-on: ubuntu-latest
    # The build image, pinned by digest (theme-parity decision D14). This is
    # the index digest that the `latest` and `main-195b9f2` tags named on
    # 2026-09-18: built that day from QuantEcon/actions@195b9f2 (Node 24, QuantEcon/actions#166)
    # (containers/quantecon-build/), amd64 only. The image rebuilds every
    # Monday and its tags move; the digest does not. Under D14 the mystmd
    # corpus builds in the same digest, so both corpora execute on one kernel:
    # bump the two repositories together. `container.image` cannot read
    # `env`, so the ref is written twice; keep the two lines identical.
    # build_info.md prints QE_CONTAINER.
    container:
      image: ghcr.io/quantecon/quantecon-build@sha256:937af97c5b9185877cc53cded64d002df6d6ce5e561467931add2a029baada93
    env:
      QE_CONTAINER: ghcr.io/quantecon/quantecon-build@sha256:937af97c5b9185877cc53cded64d002df6d6ce5e561467931add2a029baada93
    permissions:
      contents: read
      issues: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: each page's "Last changed" date and changelog come
          # from git log. A shallow clone dates every page to the checkout commit.
          fetch-depth: 0
      # A backstop: the image now trusts every work tree at system scope
      # (QuantEcon/actions#165); this guards against an image that loses that
      # entry. publish.yml says why git needs it.
      - name: Trust the checkout (backstop)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git log -1 --format='checkout %h (%cs)'
      - name: Build and Cache
        uses: quantecon/actions/build-jupyter-cache@v0
        with:
          builders: 'html'
          source-dir: 'lectures'
          create-issue-on-failure: true
