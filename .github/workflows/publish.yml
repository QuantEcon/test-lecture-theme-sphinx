# Publishes the corpus to GitHub Pages. Unlike the production lecture repos,
# which publish on a `publish*` tag, this test site publishes on every push to
# main: the comparison harness reads the live site, and a stale test site is a
# stale comparison.
name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The build image, pinned by digest (theme-parity decision D14). This is
    # the index digest that the `latest` and `main-195b9f2` tags named on
    # 2026-09-18: built that day from QuantEcon/actions@195b9f2 (Node 24, QuantEcon/actions#166)
    # (containers/quantecon-build/), amd64 only. The image rebuilds every
    # Monday and its tags move; the digest does not. Under D14 the mystmd
    # corpus builds in the same digest, so both corpora execute on one kernel:
    # bump the two repositories together. `container.image` cannot read
    # `env`, so the ref is written twice; keep the two lines identical.
    # build_info.md prints QE_CONTAINER.
    container:
      image: ghcr.io/quantecon/quantecon-build@sha256:937af97c5b9185877cc53cded64d002df6d6ce5e561467931add2a029baada93
    env:
      QE_CONTAINER: ghcr.io/quantecon/quantecon-build@sha256:937af97c5b9185877cc53cded64d002df6d6ce5e561467931add2a029baada93
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: each page's "Last changed" date and changelog come
          # from git log. A shallow clone dates every page to the checkout commit.
          fetch-depth: 0

      # The runner owns the checkout (uid 1001) and container steps run as
      # root, so git refuses the work tree unless it is trusted, and
      # quantecon-book-theme then drops every page's "Last changed" header
      # without a warning. The image now trusts every work tree at system scope
      # (QuantEcon/actions#165), so this is a backstop against an image that
      # loses that entry: it writes $HOME/.gitconfig, which every later step
      # reads. The shell's $GITHUB_WORKSPACE is the in-container path (the
      # github.workspace expression gives the host's). The last line fails
      # here, rather than silently in the theme, if git still cannot read it.
      - name: Trust the checkout (backstop)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git log -1 --format='checkout %h (%cs)'

      # The corpus's one package beyond the image, pinned and installed before
      # any notebook executes. PIP_CONSTRAINT then holds it, so code_cells.md's
      # `!pip install --upgrade quantecon` cannot move it: build_info reads the
      # same version on both corpora whatever order the pages execute in (the
      # mystmd engine runs them in parallel against this one env). Written via
      # $GITHUB_ENV from the shell, because inside a container job the
      # github.workspace expression is the host path, not this one.
      - name: Install the corpus's pinned packages
        run: |
          python -m pip install --no-cache-dir -r lectures/requirements.txt
          echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/lectures/requirements.txt" >> "$GITHUB_ENV"

      - name: Build Notebooks
        uses: quantecon/actions/build-lectures@v0
        with:
          source-dir: 'lectures'
          builder: 'jupyter'
          upload-failure-reports: true

      - name: Build HTML
        id: build
        uses: quantecon/actions/build-lectures@v0
        with:
          source-dir: 'lectures'
          builder: 'html'
          html-copy-notebooks: true
          upload-failure-reports: true

      # The engine's own output, beside the site (QuantEcon/test-lecture-theme-sphinx#3,
      # theme-parity decision D9): the docutils XML for every page, which the parity
      # project's structural layer compares with mystmd's page AST -- never one
      # theme's DOM with the other's. Built after the HTML so it reuses the
      # execution cache under ./_build (the same --path-output the action uses), and
      # under -W like every other build here. It lands in the HTML tree, so it is
      # published at /_xml/<page>.xml.
      - name: Build the docutils XML and place it under /_xml/
        run: |
          jb build lectures --path-output . --builder custom --custom-builder xml -W --keep-going
          mkdir -p "${{ steps.build.outputs.build-path }}/_xml"
          cp _build/xml/*.xml "${{ steps.build.outputs.build-path }}/_xml/"
          ls "${{ steps.build.outputs.build-path }}/_xml" | wc -l

      - name: Deploy to GitHub Pages
        id: deploy
        uses: quantecon/actions/publish-gh-pages@v0
        with:
          build-dir: ${{ steps.build.outputs.build-path }}
