# Publishes the corpus to GitHub Pages. Unlike the production lecture repos,
# which publish on a `publish*` tag, this test site publishes on every push to
# main: the comparison harness reads the live site, and a stale test site is a
# stale comparison.
name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The build image, pinned by digest (theme-parity decision D14). This is
    # the index digest that the `latest` and `main-3adfcf3` tags named on
    # 2026-09-18: built that day from QuantEcon/actions@3adfcf3
    # (containers/quantecon-build/), amd64 only. The image rebuilds every
    # Monday and its tags move; the digest does not. Under D14 the mystmd
    # corpus builds in the same digest, so both corpora execute on one kernel:
    # bump the two repositories together. `container.image` cannot read
    # `env`, so the ref is written twice; keep the two lines identical.
    # build_info.md prints QE_CONTAINER.
    container:
      image: ghcr.io/quantecon/quantecon-build@sha256:5d256c23d87fd97e510817724726e4896aed27dfeb23a6d53c58cc476e1cd7b9
    env:
      QE_CONTAINER: ghcr.io/quantecon/quantecon-build@sha256:5d256c23d87fd97e510817724726e4896aed27dfeb23a6d53c58cc476e1cd7b9
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: each page's "Last changed" date and changelog come
          # from git log. A shallow clone dates every page to the checkout commit.
          fetch-depth: 0

      # The runner owns the checkout (uid 1001) and container steps run as
      # root, so git refuses the work tree unless it is trusted, and
      # quantecon-book-theme then drops every page's "Last changed" header
      # without a warning. The image now trusts every work tree at system scope
      # (QuantEcon/actions#165), so this is a backstop against an image that
      # loses that entry: it writes $HOME/.gitconfig, which every later step
      # reads. The shell's $GITHUB_WORKSPACE is the in-container path (the
      # github.workspace expression gives the host's). The last line fails
      # here, rather than silently in the theme, if git still cannot read it.
      - name: Trust the checkout (backstop)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git log -1 --format='checkout %h (%cs)'

      - name: Build Notebooks
        uses: quantecon/actions/build-lectures@v0
        with:
          source-dir: 'lectures'
          builder: 'jupyter'
          upload-failure-reports: true

      - name: Build HTML
        id: build
        uses: quantecon/actions/build-lectures@v0
        with:
          source-dir: 'lectures'
          builder: 'html'
          html-copy-notebooks: true
          upload-failure-reports: true

      - name: Deploy to GitHub Pages
        id: deploy
        uses: quantecon/actions/publish-gh-pages@v0
        with:
          build-dir: ${{ steps.build.outputs.build-path }}
