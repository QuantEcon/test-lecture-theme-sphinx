# Jupyter Book 1 configuration for test-lecture-theme-sphinx.
#
# Mirrors the production lecture configs (lecture-python-intro's _config.yml
# at commit eb32f13e is the template) so the corpus builds exactly the way a
# real QuantEcon lecture site does: same extensions, same theme options, same
# myst-nb settings. Values that only make sense for a real site (analytics id,
# notebook repository) are set to test values and documented inline.
title: Theme Parity Test Lectures
author: QuantEcon
logo: _static/qe-logo.png
description: A representative corpus of the MyST constructs used across the QuantEcon Python lecture series, built with Jupyter Book 1 and quantecon-book-theme.

parse:
  myst_enable_extensions:  # the set every lecture repo enables (intro adds tasklist; kept)
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution
    - tasklist

only_build_toc_files: true
execute:
  execute_notebooks: "cache"
  timeout: 600
  exclude_patterns:
    - '_static/*'

html:
  baseurl: https://quantecon.github.io/test-lecture-theme-sphinx/

bibtex_bibfiles:
  - _static/quant-econ.bib

latex:
  latex_documents:
    targetname: test-lecture-theme-sphinx.tex

sphinx:
  extra_extensions: [sphinx_multitoc_numbering, sphinxext.rediraffe, sphinx_exercise, sphinx_togglebutton, sphinx.ext.intersphinx, sphinx_proof, sphinx_tojupyter, sphinx_reredirects, sphinxcontrib.youtube, sphinx.ext.todo]
  config:
    bibtex_reference_style: author_year
    linkcheck_ignore: ['https://math.stackexchange.com/*', 'https://stackoverflow.com/*']
    # myst-nb config, as the lectures set it
    nb_render_image_options:
      width: 80%
    nb_code_prompt_show: "Show {type}"
    nb_merge_streams: true
    nb_mime_priority_overrides: [
       ['html', 'application/vnd.jupyter.widget-view+json', 10],
       ['html', 'application/javascript', 20],
       ['html', 'text/html', 30],
       ['html', 'text/latex', 40],
       ['html', 'image/svg+xml', 50],
       ['html', 'image/png', 60],
       ['html', 'image/jpeg', 70],
       ['html', 'text/markdown', 80],
       ['html', 'text/plain', 90],
       ['jupyter', 'application/vnd.jupyter.widget-view+json', 10],
       ['jupyter', 'application/javascript', 20],
       ['jupyter', 'text/html', 30],
       ['jupyter', 'text/latex', 40],
       ['jupyter', 'image/svg+xml', 50],
       ['jupyter', 'image/png', 60],
       ['jupyter', 'image/jpeg', 70],
       ['jupyter', 'text/markdown', 80],
       ['jupyter', 'text/plain', 90],
       ['latex', 'text/latex', 10],
       ['latex', 'application/pdf', 20],
       ['latex', 'image/png', 30],
       ['latex', 'image/jpeg', 40],
       ['latex', 'text/markdown', 50],
       ['latex', 'text/plain', 60],
       ['linkcheck', 'text/plain', 10],
     ]
    suppress_warnings: [mystnb.unknown_mime_type, myst.domains]
    # sphinx-proof
    proof_minimal_theme: true
    # sphinx-exercise
    exercise_style: "solution_follow_exercise"
    # sphinx.ext.todo is loaded by two lecture repos with todo_include_todos unset,
    # so `{todo}` blocks are invisible to readers on the Sphinx sites.
    # -------------
    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    html_favicon: _static/lectures-favicon.ico
    html_theme: quantecon_book_theme
    html_static_path: ['_static']
    html_theme_options:
      authors:
        - name: Thomas J. Sargent
          url: http://www.tomsargent.com/
        - name: John Stachurski
          url: https://johnstachurski.net/
      dark_logo: quantecon-logo-transparent.png
      header_organisation_url: https://quantecon.org
      header_organisation: QuantEcon
      repository_url: https://github.com/QuantEcon/test-lecture-theme-sphinx
      # Test value: the production sites point at a `.notebooks` companion repo.
      # There is none for this corpus, so the Launch control targets a repo that
      # does not exist -- deliberately, to exercise the dead-link case (#205).
      nb_repository_url: https://github.com/QuantEcon/test-lecture-theme-sphinx.notebooks
      path_to_docs: lectures
      twitter: quantecon
      twitter_logo_url: https://assets.quantecon.org/img/qe-twitter-logo.png
      og_logo_url: https://assets.quantecon.org/img/qe-og-logo.png
      description: A representative corpus of the MyST constructs used across the QuantEcon Python lecture series.
      keywords: Python, QuantEcon, Quantitative Economics, Economics, MyST, Jupyter Book, theme, test
      # No analytics on a test site.
      launch_buttons:
        colab_url                 : https://colab.research.google.com
        thebe                     : false
    intersphinx_mapping:
      intro:
        - https://intro.quantecon.org/
        - null
      pyprog:
        - https://python-programming.quantecon.org/
        - null
    # The union of the macro sets the lecture configs define. Note the theme
    # injects its own set too (layout.html) whenever mathjax_path is MathJax 3;
    # `\Exp` and `\linop` below come only from this config, `\argmax` from both.
    mathjax3_config:
      tex:
        macros:
          "argmax" : "arg\\,max"
          "argmin" : "arg\\,min"
          "col"    : "col"
          "Span"   : "span"
          "epsilon": "\\varepsilon"
          "EE": "\\mathbb{E}"
          "PP": "\\mathbb{P}"
          "RR": "\\mathbb{R}"
          "NN": "\\mathbb{N}"
          "ZZ": "\\mathbb{Z}"
          "BB": "\\mathbb{B}"
          "dD": "\\mathcal{D}"
          "fF": "\\mathcal{F}"
          "lL": "\\mathcal{L}"
          "Exp": "\\operatorname{Exp}"
          "linop": "\\mathcal{L}(\\mathbb{B})"
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    rediraffe_redirects:
      index_toc.md: intro.md
    # Remote redirects, as four lecture repos carry (sphinx-reredirects).
    redirects:
      heavy_tails:   https://intro.quantecon.org/heavy_tails.html
    tojupyter_static_file_path: ["_static"]
    tojupyter_target_html: true
    tojupyter_urlpath: "https://quantecon.github.io/test-lecture-theme-sphinx/"
    tojupyter_image_urlpath: "https://quantecon.github.io/test-lecture-theme-sphinx/_static/"
    tojupyter_lang_synonyms: ["ipython", "ipython3", "python"]
    tojupyter_kernels:
      python3:
        kernelspec:
          display_name: "Python"
          language: python3
          name: python3
        file_extension: ".py"
    tojupyter_images_markdown: true
